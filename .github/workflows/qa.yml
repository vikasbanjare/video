# Pulse autonomous QA battery — runs WITHOUT any human:
#   · on every push (any branch)
#   · every night at 02:17 UTC (catches environment/dependency rot)
#
# What it runs (CutPilot/test/run-tests.js drives all of it):
#   1. 450+ unit tests (caption grouping, takes cleanup, alignment, transcript)
#   2. 70+ host tests — the REAL jsx/host.jsx against a mini-Premiere
#   3. Template audit — every style has a loadable font, valid colours, legible
#   4. Ground-truth preview simulation — previews measured against the caption
#      engine's own authored numbers (from inside the .mogrt)
#   5. Panel proofs — the real panel in headless Chromium: style→engine
#      mapping, tile==preview parity, live controls, smart emphasis
#
# A red run means something the user would see is broken — fix before shipping.
name: QA battery
on:
  push:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
jobs:
  battery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # unzip is ALREADY on the ubuntu-latest image, and the battery only needs
      # the binary (panel-proofs reads definition.json straight out of a .mogrt).
      # This used to run `apt-get update` unconditionally — a full mirror refresh
      # for a tool that is already installed — and on 2026-08-19 that stalled on
      # two different runners back to back, eating the job budget before a single
      # test ran. Only reach the network if the binary is genuinely missing, and
      # cap it so a mirror stall fails fast instead of starving the battery.
      - name: System deps (unzip for .mogrt inspection)
        timeout-minutes: 3
        run: command -v unzip >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq unzip; }
      - name: Headless Chrome (for the simulation + panel proofs)
        run: npm i --no-save puppeteer@23
      - name: Full battery
        env:
          CI: 'true'
        run: node CutPilot/test/run-tests.js
